- insert:
    - id: future-cup-platform
      name: '@deepseek-ai/dsh-experimental-future-cup-platform'
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.FUTURE_CUP_PORT ?? 3090)
        databaseDriver: !!js >-
          process.env.FUTURE_CUP_DATABASE_URL ? 'postgres' : 'sqlite'
        databaseUrl: !!js process.env.FUTURE_CUP_DATABASE_URL
        sqlitePath: !!js process.env.FUTURE_CUP_SQLITE_PATH ?? '.artifacts/future-cup-platform.sqlite'
        outboxPollMs: 100
        outboxBatchSize: 100
        outboxClaimMs: 30000
        workspaceRoot: !!js process.env.FUTURE_CUP_RUN_ROOT ?? '.artifacts/future-cup-runs'
        agentHomeRoot: !!js process.env.FUTURE_CUP_AGENT_HOME_ROOT ?? '.artifacts/future-cup-agent-homes'
        uiRoot: !!js process.env.FUTURE_CUP_UI_ROOT ?? undefined
        runProvider: !!js process.env.FUTURE_CUP_PROVIDER ?? undefined
        runModel: !!js process.env.FUTURE_CUP_MODEL ?? undefined
        runMaxTokens: 32000
        runRequestTimeoutMs: 600000
        verificationBuildTimeoutMs: 600000
        verificationBrowserTimeoutMs: 60000
        maxRepairRounds: 3
        repairTimeoutMs: 600000
        maxAgentRetries: 1
        leaseDurationMs: 60000
        heartbeatIntervalMs: 15000
        settlementRetryMs: 1000
        settlementWaitMs: 30000

<!-- Future Cup brand mark: a neumorphic rounded tile carrying the RR monogram,
     violet-to-blue orbit and spark. Shared by the sidebar and the favicon.
     The raised outer shadow is supplied by neumorphic.css. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Future Cup">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF7F1"/>
      <stop offset="1" stop-color="#E8DDD2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9B9AA" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AC95FF"/>
      <stop offset="0.42" stop-color="#7C7BFF"/>
      <stop offset="1" stop-color="#1B57FF"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="32" fill="url(#tile)"/>
  <rect x="1" y="1" width="118" height="118" rx="31" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g transform="translate(12 25.75) scale(0.2038)" fill-rule="evenodd" stroke-linejoin="round">

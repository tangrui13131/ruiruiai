name: Gate probe (temporary)

on:
  push:
    paths:
      - '.github/gate-probe-trigger'

permissions:
  contents: write

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium, WebKit, and hosted dependencies
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E 's@http://([a-z]{2}\.)?archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g; s@http://security\.ubuntu\.com/ubuntu@https://security.ubuntu.com/ubuntu@g' {} +
          pnpm --filter @deepseek-ai/dsh-experimental-future-cup-orchestration exec playwright install --with-deps chromium webkit
      - name: Run the consumers lane
        run: pnpm run check:ci:consumers > lane.log 2>&1 || true
      - name: Publish the failure excerpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed 's/\x1b\[[0-9;]*m//g' lane.log > lane-clean.log
          {
            echo '# Gate probe failure excerpt'
            echo '```'
            grep -n 'fail-fast aborting\|== FAILED\|No test files\|Error\|FAIL' lane-clean.log | tail -n 40 || true
            echo '```'
            echo '## Tail'
            echo '```'
            tail -n 120 lane-clean.log
            echo '```'
          } > gate-probe-failure.md
          content=$(base64 -w0 gate-probe-failure.md)
          sha=$(gh api repos/${{ github.repository }}/contents/gate-probe-failure.md --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/gate-probe-failure.md -f message='chore: probe failure excerpt' -f content="$content" -f sha="$sha" -f branch='${{ github.ref_name }}'
          else
            gh api --method PUT repos/${{ github.repository }}/contents/gate-probe-failure.md -f message='chore: probe failure excerpt' -f content="$content" -f branch='${{ github.ref_name }}'
          fi

name: Gate probe (temporary)

on:
  push:
    paths:
      - '.github/gate-probe-trigger'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_FAIL_FAST: '1'
    outputs:
      failing: ${{ steps.report.outputs.failing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium, WebKit, and hosted dependencies
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E 's@http://([a-z]{2}\.)?archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g; s@http://security\.ubuntu\.com/ubuntu@https://security.ubuntu.com/ubuntu@g' {} +
          pnpm --filter @deepseek-ai/dsh-experimental-future-cup-orchestration exec playwright install --with-deps chromium webkit
      - name: Run the consumers lane
        id: lane
        run: pnpm run check:ci:consumers > lane.log 2>&1 || true
      - name: Report the failing gate
        id: report
        run: |
          line=$(grep -m1 'fail-fast aborting:' lane.log || true)
          detail=$(grep -m1 -E '^[[:space:]]*(FAIL |AssertionError|Error:)' lane.log || true)
          if [ -z "$line" ]; then line='lane passed'; fi
          combined="$line :: $detail"
          echo "failing=$(printf '%s' "$combined" | tr -cd '[:alnum:]:./_ -' | cut -c1-200)" >> "$GITHUB_OUTPUT"

  verdict:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    name: "verdict: ${{ needs.lane.outputs.failing }}"
    steps:
      - run: echo "${{ needs.lane.outputs.failing }}"
